services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsewatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    volumes:
      - pulsewatch-pgdata:/var/lib/postgresql/data   # persist data Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pulsewatch:
    build: .
    container_name: pulsewatch
    restart: unless-stopped
    # Beri ruang bagi shutdown rapi (SHUTDOWN_TIMEOUT_SECONDS) sebelum SIGKILL
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsewatch}:${POSTGRES_PASSWORD:-pulsewatch}@postgres:5432/${POSTGRES_DB:-pulsewatch}
      # GANTI nilai ini di production (lewat file .env)
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      # Zona waktu untuk jadwal maintenance berulang (harian/mingguan)
      TZ: ${TZ:-Asia/Jakarta}
      # Opsional — lihat .env.example untuk daftar lengkapnya
      JWT_TTL: ${JWT_TTL:-7d}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CERT_ALERT_THRESHOLDS: ${CERT_ALERT_THRESHOLDS:-30,14,7,3}
      CERT_CHECK_INTERVAL_HOURS: ${CERT_CHECK_INTERVAL_HOURS:-6}
      CERT_EXPIRY_WARN_DAYS: ${CERT_EXPIRY_WARN_DAYS:-14}
      HEARTBEAT_RETENTION_DAYS: ${HEARTBEAT_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SLA_EXCLUDE_MAINTENANCE: ${SLA_EXCLUDE_MAINTENANCE:-true}
      SLO_DEFAULT_TARGET: ${SLO_DEFAULT_TARGET:-}
      # Lokasi instance ini; jadi label pada setiap heartbeat yang ditulisnya
      LOCATION_NAME: ${LOCATION_NAME:-primary}
      PRIMARY_LOCATION: ${PRIMARY_LOCATION:-primary}
      # Token scrape Prometheus (kosong = hanya token login yang diterima)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Rate limit API key & webhook aksi
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60}
      ACTION_WEBHOOK_ATTEMPTS: ${ACTION_WEBHOOK_ATTEMPTS:-3}
      NOTIFICATION_LOG_RETENTION_DAYS: ${NOTIFICATION_LOG_RETENTION_DAYS:-30}
      LATENCY_RECOVERY_RATIO: ${LATENCY_RECOVERY_RATIO:-0.9}
      RENOTIFY_DEFAULT_MINUTES: ${RENOTIFY_DEFAULT_MINUTES:-}
      # Lease scheduler: hanya satu proses per lokasi yang menjalankan check
      SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-30}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    volumes:
      # Opsional: taruh file SQLite lama di ./legacy/ untuk dimigrasi
      # docker compose exec pulsewatch npm run migrate:sqlite -- /legacy/pulsewatch.db
      - ./legacy:/legacy:ro

  # --- Worker lokasi kedua (opsional) ---
  # Contoh ini menjalankan worker di mesin yang sama, jadi hanya berguna untuk
  # mencoba mekanismenya. Multi-location yang sebenarnya berarti menjalankan
  # service ini di host/region lain dengan DATABASE_URL menunjuk balik ke
  # Postgres di sini (lihat README).
  #
  #   docker compose --profile multi-location up -d
  #
  pulsewatch-worker:
    profiles: ["multi-location"]
    build: .
    container_name: pulsewatch-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsewatch}:${POSTGRES_PASSWORD:-pulsewatch}@postgres:5432/${POSTGRES_DB:-pulsewatch}
      # JWT_SECRET harus sama dengan instance web: kunci enkripsi kredensial
      # monitor diturunkan darinya (atau set ENCRYPTION_KEY yang sama di keduanya).
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      WORKER_ONLY: "true"
      LOCATION_NAME: ${WORKER_LOCATION_NAME:-secondary}
      PRIMARY_LOCATION: ${PRIMARY_LOCATION:-primary}
      SCHEDULER_LEASE_SECONDS: ${SCHEDULER_LEASE_SECONDS:-30}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
      TZ: ${TZ:-Asia/Jakarta}
    # Migration dijalankan instance web; worker langsung mulai agar tidak balapan
    command: ["node", "src/index.js"]

volumes:
  pulsewatch-pgdata:
