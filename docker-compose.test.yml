# Target uji untuk tipe monitor database. Bukan bagian dari deployment.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v
#
# `name` WAJIB ada dan wajib berbeda dari compose utama. Tanpa itu, Compose
# memakai nama direktori sebagai nama proyek, dan service bernama `postgres` di
# sini akan dianggap service yang sama dengan `postgres` di docker-compose.yml:
# container produksinya digantikan dan volume datanya ikut dipasang ke sini.
name: pulsewatch-test

services:
  # Nama service pun sengaja diberi awalan, sebagai lapis pengaman kedua
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pw
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: pwtest
    ports: ["55432:5432"]
    # Tanpa volume: data uji memang tidak perlu bertahan, dan tidak adanya
    # volume membuat compose ini tidak mungkin menempel ke data sungguhan.
    tmpfs: ["/var/lib/postgresql/data"]

  test-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: pwtest
    ports: ["53306:3306"]

  # Oracle Free (ada image arm64). Butuh ~1-2 menit sampai service FREEPDB1
  # siap; APP_USER dibuat otomatis di PDB itu.
  #   oracle://pw:pw@localhost:51521/FREEPDB1
  test-oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: pw
      APP_USER: pw
      APP_USER_PASSWORD: pw
    ports: ["51521:1521"]

  # Hanya ada image amd64; di Apple Silicon butuh Rosetta di Docker Desktop.
  #   mssql://sa:Pwtest-12345@localhost:51433/master?trustServerCertificate=true
  test-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Pwtest-12345
    ports: ["51433:1433"]

  test-redis:
    image: redis:7-alpine
    ports: ["56379:6379"]

  # Kafka mode KRaft (tanpa ZooKeeper). Butuh ~20 detik sampai siap menerima
  # koneksi, jauh lebih lama dari target uji lainnya.
  test-kafka:
    image: apache/kafka:3.8.0
    # Port host dan port dalam container dibuat sama, dan listener-nya dua:
    # satu untuk perkakas di dalam container, satu yang dikabarkan ke klien di
    # host. Kafka mengabarkan alamatnya sendiri ke klien, jadi satu listener
    # saja selalu salah untuk salah satu pihak.
    ports: ["59092:59092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:59092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://127.0.0.1:59092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
